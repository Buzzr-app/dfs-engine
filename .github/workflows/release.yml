name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact synchronized release version, without the v prefix
        required: true
        type: string
      expected_commit:
        description: Reviewed 40-character commit on main to publish
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH to authorize the irreversible npm release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buzzr-release
  cancel-in-progress: false

jobs:
  authorize-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      reviewed-commit: ${{ steps.authorize.outputs.commit }}
    steps:
      - name: Authorize exact current main commit
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_RELEASE_VERSION: ${{ inputs.expected_version }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          GITHUB_SHA_AT_DISPATCH: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_PUBLISH" == "PUBLISH" ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$EXPECTED_RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          REMOTE_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA_AT_DISPATCH" = "$EXPECTED_COMMIT"
          test "$REMOTE_MAIN" = "$EXPECTED_COMMIT"
          echo "commit=$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: authorize-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      reviewed-commit: ${{ needs.authorize-release.outputs.reviewed-commit }}
    steps:
      - name: Revalidate current main before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.authorize-release.outputs.reviewed-commit }}
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$REMOTE_MAIN" = "$EXPECTED_COMMIT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize-release.outputs.reviewed-commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate checked-out release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.authorize-release.outputs.reviewed-commit }}
          EXPECTED_RELEASE_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          node scripts/check-release-version.mjs
      - name: Install reviewed npm CLI and dependencies
        run: |
          npm install --global npm@12.0.1
          npm --version
          npm ci --ignore-scripts
      - name: Run complete release verification
        run: npm run verify
      - name: Confirm generated artifacts did not change the release commit
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Pack and hash the exact MCP artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --workspace @buzzr/mcp --json --pack-destination "$RUNNER_TEMP")"
          filename="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value[0].filename)' "$pack_json")"
          integrity="$(node scripts/compute-npm-integrity.mjs "$RUNNER_TEMP/$filename")"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          echo "Expected MCP integrity: $integrity" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish changed packages through npm trusted publishing
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm exec changeset publish
      - name: Prove the exact live MCP artifact
        shell: bash
        env:
          EXPECTED_MCP_VERSION: ${{ inputs.expected_version }}
          EXPECTED_MCP_INTEGRITY: ${{ steps.pack.outputs.integrity }}
          EXPECTED_GIT_HEAD: ${{ needs.authorize-release.outputs.reviewed-commit }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm run proof:mcp:published; then
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 10
            fi
          done
          exit 1

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the immutable GitHub release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.expected_version }}
          RELEASE_COMMIT: ${{ needs.publish-npm.outputs.reviewed-commit }}
          MCP_INTEGRITY: ${{ needs.publish-npm.outputs.integrity }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          release_note="Published from $RELEASE_COMMIT with reviewed @buzzr/mcp integrity $MCP_INTEGRITY."

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            test "$tag_commit" = "$RELEASE_COMMIT"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
            grep -Fqx "$release_note" <<< "$existing_body"
            exit 0
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "$tag" \
            --generate-notes \
            --notes "$release_note"
