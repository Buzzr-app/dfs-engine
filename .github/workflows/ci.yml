name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: matrix.node == 24
        run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:mcp:packed
      - run: npm run test:packages:packed
      - run: npm run check:mcp:client-skill
      - run: npm run check:mcp:examples
      - run: npm run check:skill
      - run: npm run docs
      - run: npm run check:docs
      - run: npm run check:links
      # External URLs are checked only after reviewed code reaches main. PR
      # Markdown must not turn the shared CI runner into an arbitrary URL probe.
      - if: matrix.node == 22 && github.event_name == 'push'
        run: npm run check:links:external
      - run: npm run smoke:exports
      - run: npm run size:check
      - run: npm run pack:smoke
      - run: npm run bench
      - run: npm run audit:high

  mcp-packed-platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mcp:packed
      - run: npm run build:mcpb
      - run: npm run proof:mcpb
