name: prove published MCP

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Published @buzzr/mcp version expected on npm latest
        required: true
        type: string
      expected_integrity:
        description: Reviewed npm dist.integrity for the exact release
        required: true
        type: string
      expected_git_head:
        description: Reviewed 40-character git commit for the exact release
        required: true
        type: string

permissions:
  contents: read

jobs:
  prove:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run proof:mcp:published
        env:
          EXPECTED_MCP_VERSION: ${{ inputs.expected_version }}
          EXPECTED_MCP_INTEGRITY: ${{ inputs.expected_integrity }}
          EXPECTED_GIT_HEAD: ${{ inputs.expected_git_head }}
